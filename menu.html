<script>
const sections = [
  ["POR QUE A CCC?", `UM COMPROMISSO COM O FUTURO DA HUMANIDADE

Uma nova era para o capital, a sustentabilidade e a responsabilidade global.

Há momentos na história em que a humanidade é chamada a tomar decisões que ultrapassam os interesses de uma geração, os limites de uma economia e as fronteiras de uma nação.

Estamos diante de um desses momentos.

O desenvolvimento econômico, o avanço tecnológico e a preservação ambiental já não podem ser tratados como caminhos independentes.

A Carbon Credit Coins nasce com a proposta de unir tecnologia, capital e responsabilidade ambiental em uma visão institucional de longo prazo.

Preservar o planeta não é apenas uma responsabilidade ambiental. É uma decisão econômica, estratégica e civilizatória.

A CCC representa uma visão de futuro baseada em transparência, rastreabilidade e responsabilidade.`],

  ["MERCADO DE CARBONO", `MERCADO DE CARBONO — UMA NOVA VISÃO GLOBAL

O mercado de carbono representa um dos instrumentos estratégicos da transição para uma economia de baixo carbono. Entretanto, seu desenvolvimento ainda enfrenta desafios relacionados à transparência, rastreabilidade, dupla contagem, dupla utilização de créditos e barreiras de acesso.

A negociação tradicional, frequentemente estruturada em unidades equivalentes a uma tonelada de CO₂, pode dificultar operações de menor escala e limitar a participação de novos agentes econômicos.

A Carbon Credit Coins (CCC), iniciativa da YNK & Co., propõe uma evolução desse modelo por meio da tecnologia blockchain, da representação digital fracionada e de mecanismos de governança e verificação.

UM NOVO PARADIGMA DE ACESSIBILIDADE

O modelo econômico em desenvolvimento estabelece a referência inicial de:

1 CCC = US$ 1 = 164 kg de CO₂ equivalente.

Essa equivalência representa uma proposta de estruturação econômica e ambiental, ainda em fase de implementação e documentação. Não constitui, neste estágio, comprovação de lastro integral, preço de mercado garantido ou direito automático de compensação ambiental.

A proposta busca permitir operações em frações inferiores a uma tonelada, ampliando a acessibilidade e a flexibilidade das negociações.

INTEGRIDADE, RASTREABILIDADE E TRANSPARÊNCIA

A CCC pretende desenvolver mecanismos de identificação individualizada dos créditos elegíveis, registro de titularidade, verificação documental, acompanhamento de movimentações e controles destinados a prevenir a dupla contagem e a dupla utilização.

A utilização de blockchain poderá contribuir para a rastreabilidade das operações, mas a integridade ambiental dependerá também de registros reconhecidos, verificações independentes e procedimentos adequados de aposentadoria dos créditos.

GOVERNANÇA E PADRÕES INTERNACIONAIS

Nosso objetivo é colaborar com certificadoras, auditores, instituições financeiras, participantes do mercado e autoridades competentes para fortalecer padrões de transparência, responsabilidade e segurança.

A CCC pretende contribuir para o aperfeiçoamento das práticas do setor, respeitando as competências dos órgãos reguladores e os requisitos aplicáveis a cada jurisdição.

NOSSA VISÃO

Mais do que digitalizar ativos ambientais, buscamos desenvolver uma infraestrutura capaz de aproximar tecnologia, capital e sustentabilidade.

A ambição da Carbon Credit Coins é tornar-se referência internacional em inovação, acessibilidade e integridade no mercado de carbono, contribuindo para um ecossistema mais transparente, eficiente e responsável.`],

  ["SUSTENTABILIDADE", `SUSTENTABILIDADE
O VALOR DO FUTURO COMEÇA COM A RESPONSABILIDADE DO PRESENTE

A sustentabilidade deixou de ser uma escolha exclusivamente ambiental para tornar-se um dos pilares fundamentais da economia global, da segurança dos investimentos e da continuidade das próximas gerações.

A Carbon Credit Coins (CCC), iniciativa da YNK & Co., nasce da convicção de que desenvolvimento econômico, inovação tecnológica e preservação dos recursos naturais devem avançar de forma integrada, responsável e transparente.

NOSSO COMPROMISSO COM O PLANETA

Acreditamos que a preservação ambiental precisa ultrapassar o campo das declarações institucionais e transformar-se em mecanismos concretos de responsabilidade, mensuração e acompanhamento.

Nossa proposta é contribuir para um ambiente em que ativos ambientais possam ser identificados, documentados, verificados e acompanhados por meio de processos transparentes, respeitando critérios técnicos e padrões internacionalmente reconhecidos.

SUSTENTABILIDADE E INOVAÇÃO FINANCEIRA

A CCC busca desenvolver uma infraestrutura digital que amplie o acesso ao mercado de carbono e permita novas formas de participação econômica em iniciativas relacionadas à redução e à remoção de emissões de gases de efeito estufa.

Por meio da tecnologia blockchain, pretendemos fortalecer a rastreabilidade das operações, a integridade das informações e a transparência dos ativos ambientais representados digitalmente.

Entendemos, entretanto, que a tecnologia, isoladamente, não comprova benefícios ambientais. A credibilidade depende de documentação verificável, controles independentes e mecanismos adequados de registro e prevenção da dupla contagem.

RESPONSABILIDADE AMBIENTAL E GOVERNANÇA

Nossa visão de sustentabilidade está fundamentada em três compromissos essenciais:

INTEGRIDADE AMBIENTAL
Priorizar critérios de qualidade, verificabilidade e autenticidade dos ativos ambientais.

RESPONSABILIDADE INSTITUCIONAL
Desenvolver mecanismos de governança, transparência e prestação de contas.

ACESSIBILIDADE ECONÔMICA
Buscar formas de ampliar a participação no mercado ambiental sem comprometer seus padrões de integridade.

A sustentabilidade deve representar valor real para o planeta, segurança para os participantes e responsabilidade perante a sociedade.

UM COMPROMISSO COM AS PRÓXIMAS GERAÇÕES

Não consideramos a sustentabilidade uma tendência passageira, mas uma transformação estrutural na maneira como o mundo produz, investe, negocia e preserva seus recursos.

Nossa ambição é contribuir para um mercado no qual crescimento econômico e responsabilidade ambiental deixem de ser objetivos concorrentes e passem a integrar uma mesma estratégia de desenvolvimento.

NOSSA VISÃO DE FUTURO

A Carbon Credit Coins pretende construir uma referência internacional em inovação ambiental, transparência e integração entre tecnologia e sustentabilidade.

Mais do que participar da transformação da economia verde, queremos contribuir para a construção de seus novos padrões.

CARBON CREDIT COINS — TRANSFORMANDO RESPONSABILIDADE AMBIENTAL EM VISÃO DE FUTURO.`],

  ["GOVERNANÇA", `GOVERNANÇA CORPORATIVA
ESTRUTURA, RESPONSABILIDADE E TRANSPARÊNCIA COMO FUNDAMENTOS DA CONFIANÇA INSTITUCIONAL

A Carbon Credit Coins (CCC) reconhece que a credibilidade de um projeto internacional não se estabelece exclusivamente pela inovação tecnológica ou pelo potencial econômico de seus ativos, mas pela solidez de sua governança, pela responsabilidade de suas decisões e pela transparência de suas operações.

Como iniciativa vinculada à YNK & Co., a CCC adota uma visão de governança orientada à integridade institucional, à proteção dos participantes e ao desenvolvimento responsável do mercado de ativos ambientais digitais.

ESTRUTURA INSTITUCIONAL E DIREÇÃO ESTRATÉGICA

O projeto informa contar com uma estrutura organizacional composta por oito diretores, distribuídos em funções de direção, planejamento, supervisão e desenvolvimento estratégico.

Essa estrutura constitui a base do modelo institucional proposto para a Carbon Credit Coins, contemplando responsabilidades relacionadas à gestão corporativa, tecnologia, operações, sustentabilidade, conformidade, desenvolvimento de mercados e relacionamento institucional.

A formalização das atribuições, competências e procedimentos internos integra o processo de consolidação da governança do projeto.

TRANSPARÊNCIA E PRESTAÇÃO DE CONTAS

A CCC considera a transparência um requisito fundamental para a construção de relações duradouras com participantes, instituições e parceiros internacionais.

Nossa proposta contempla o desenvolvimento progressivo de mecanismos de divulgação de informações relevantes, documentação das operações, rastreabilidade dos ativos e prestação de contas.

A tecnologia blockchain poderá apoiar a verificabilidade das movimentações digitais, enquanto procedimentos documentais e controles independentes deverão sustentar a integridade das informações ambientais e financeiras.

CONFORMIDADE E RESPONSABILIDADE REGULATÓRIA

A atuação internacional exige respeito às legislações, aos requisitos regulatórios e às particularidades de cada jurisdição.

A Carbon Credit Coins pretende estruturar políticas e procedimentos proporcionais às suas atividades, incluindo, quando aplicáveis, identificação e diligência de participantes, prevenção à lavagem de dinheiro, proteção de dados, gestão de riscos e controles de integridade.

O projeto reconhece a importância do relacionamento responsável com autoridades, certificadoras, auditores e demais instituições competentes.

A CCC não se apresenta como autoridade reguladora ou certificadora independente de créditos de carbono.

INTEGRIDADE DOS ATIVOS AMBIENTAIS

A governança ambiental deverá contemplar critérios de elegibilidade, verificação documental, identificação dos créditos, acompanhamento de titularidade e mecanismos destinados a prevenir a dupla contagem e a dupla utilização.

O vínculo entre unidades digitais e ativos ambientais dependerá de documentação verificável, registros adequados e procedimentos de controle compatíveis com o modelo operacional adotado.

A representação digital de um ativo não substitui sua certificação, comprovação de existência ou validação ambiental.

FUNDAÇÃO CARBON CREDIT COINS

A Fundação Carbon Credit Coins encontra-se em fase de estruturação institucional e desenvolvimento documental.

Sua proposta é contribuir para a consolidação de iniciativas relacionadas à sustentabilidade, à educação ambiental, à inovação e à responsabilidade social, observadas as condições jurídicas e operacionais necessárias à sua formalização.

const menu = document.getElementById("menu");
const detail = document.getElementById("detail");
const navigation = document.getElementById("navigation");
const heading = document.getElementById("heading");
const description = document.getElementById("description");

function openDetail(title, text) {
  heading.textContent = title;
  heading.hidden = (title === "POR QUE A CCC?");
  description.textContent = text;

  const oldPanel = detail.querySelector("#ccc-financial-panel");
  if (oldPanel) oldPanel.remove();

  if (title === "Ethereum") {
    const panel = document.createElement("section");
    panel.id = "ccc-financial-panel";
    panel.style.cssText = "background:#080808;color:#d8b66a;border:1px solid #9d7b37;border-radius:16px;padding:20px;margin:20px auto;max-width:900px";

    panel.innerHTML = `
      <h2 style="text-align:center;color:#e2c17b">CCC | DIGITAL ASSETS</h2>
      <p style="text-align:center;color:#aaa">Ethereum · Monitoramento blockchain</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px">
        <div class="ccc-card"><strong>CCC emitidos</strong><p id="ccc-supply">Consultando blockchain...</p></div>
        <div class="ccc-card"><strong>Saldo da carteira</strong><p id="ccc-balance">Não conectado</p></div>
        <div class="ccc-card"><strong>Valor de referência CCC</strong><p id="ccc-value">Não disponível</p></div>
        <div class="ccc-card"><strong>Transações</strong><p id="ccc-transactions">Aguardando consulta</p></div>
      </div>
      <div style="text-align:center;margin:22px 0">
        <div style="color:#c9a45b;font-size:14px;line-height:1.8">
          <strong>CONTRATO CCC · ERC-20</strong>
          <div style="overflow-wrap:anywhere;margin-top:8px">
            0x9640Bb4eb644d05Ed5E928504cb69D00823BF7c5
          </div>
        </div>
      </div>
      <h3 style="margin-top:28px">Gráficos e histórico</h3>
      <div id="ccc-line-chart" style="background:#10151e;border:1px solid #66532d;border-radius:14px;padding:16px;margin:14px 0 22px">
        <strong style="color:#d8b66a">CCC · Volume de transferências</strong>
        <p style="color:#aaa;font-size:12px">Histórico real · Ethereum</p>
        <div id="ccc-line-content">Carregando gráfico...</div>
      </div>

      
    `;

    panel.querySelectorAll(".ccc-card").forEach(card => {
      card.style.cssText = "background:#151515;border:1px solid #65512b;border-radius:12px;padding:15px;text-align:center";
    });

    description.parentNode.insertBefore(panel, description.nextSibling);
    const supplyStatus = panel.querySelector("#ccc-supply");
    supplyStatus.id = "ccc-live-supply";

    fetch("https://ethereum.publicnode.com", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        jsonrpc:"2.0",
        id:1,
        method:"eth_call",
        params:[{
          to:"0x9640Bb4eb644d05Ed5E928504cb69D00823BF7c5",
          data:"0x18160ddd"
        },"latest"]
      })
    })
    .then(r => {
      if (!r.ok) throw new Error("RPC indisponivel");
      return r.json();
    })
    .then(d => {
      if (!d.result || d.result === "0x") throw new Error("Resposta invalida");
      const total = BigInt(d.result) / (10n ** 18n);
      supplyStatus.textContent = total.toLocaleString("pt-BR") + " CCC";
    })
    .catch(() => {
      supplyStatus.textContent = "Consulta indisponível";
    });


    fetch("data/ccc-wallet-summary.json?refresh=" + Date.now())
      .then(r => {
        if (!r.ok) throw new Error("Saldo indisponivel");
        return r.json();
      })
      .then(data => {
        const balance = Number(data.balance_ccc);
        if (!Number.isFinite(balance)) throw new Error("Saldo invalido");

        const fmt = n => n.toLocaleString("pt-BR", {
          maximumFractionDigits: 6
        });

        panel.querySelector("#ccc-balance").textContent =
          fmt(balance) + " CCC";

        panel.querySelector("#ccc-value").textContent =
          "US$ " + fmt(balance) + " · " +
          fmt(balance * 164 / 1000) + " t CO₂e (referência do projeto)";
      })
      .catch(() => {
        panel.querySelector("#ccc-balance").textContent =
          "Consulta indisponível";
        panel.querySelector("#ccc-value").textContent =
          "Referência indisponível";
      });

    if (title === "Ethereum") {
      const chart = document.createElement("div");
      chart.id = "ccc-history-chart";
      chart.style.cssText = "margin-top:18px;color:#d8b66a";
      chart.textContent = "Carregando transferências CCC...";

      panel.appendChild(chart);


      fetch("data/ccc-transfers.json?refresh=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error("Dados indisponíveis");
          return r.json();
        })
        .then(data => {
          const host = panel.querySelector("#ccc-line-content");
          const txs = (data.transfers || []).slice()
            .sort((a,b) => Number(a.timestamp)-Number(b.timestamp));
          if (!txs.length) {
            host.textContent = "Sem transferências.";
            return;
          }

          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 600 260");
          svg.setAttribute("role", "img");
          svg.setAttribute("aria-label", "Volume de transferências CCC ao longo do tempo");
          svg.style.cssText = "width:100%;height:auto;display:block";

          const make = (tag, attrs) => {
            const el = document.createElementNS(ns, tag);
            Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,String(v)));
            svg.appendChild(el);
            return el;
          };

          const values = txs.map(t => Number(t.amount_ccc));
          const max = Math.max(...values, 1);
          const minTime = Number(txs[0].timestamp);
          const maxTime = Number(txs[txs.length-1].timestamp);
          const points = txs.map((t,i) => {
            const time = Number(t.timestamp);
            const x = maxTime > minTime
              ? 42 + (time-minTime)/(maxTime-minTime)*530
              : 42 + i*530/Math.max(txs.length-1,1);
            const y = 215 - Number(t.amount_ccc)/max*175;
            return [x,y];
          });

          for (let i=0;i<=4;i++) {
            const y=40+i*43.75;
            make("line",{x1:42,y1:y,x2:572,y2:y,stroke:"#344052","stroke-dasharray":"4 5"});
          }

          const coords = points.map(p => p.join(",")).join(" ");
          make("polygon",{
            points:"42,215 "+coords+" 572,215",
            fill:"#164c70","fill-opacity":"0.24"
          });
          make("polyline",{
            points:coords,fill:"none",stroke:"#29b6f6",
            "stroke-width":"4","stroke-linecap":"round",
            "stroke-linejoin":"round"
          });

          points.forEach((pt,i) => {
            const dot = make("circle",{
              cx:pt[0],cy:pt[1],r:6,
              fill:i===points.length-1?"#e6c57d":"#36d399",
              stroke:"#10151e","stroke-width":2
            });
            const tip=document.createElementNS(ns,"title");
            tip.textContent=new Date(Number(txs[i].timestamp)*1000)
              .toLocaleDateString("pt-BR")+" · "+
              values[i].toLocaleString("pt-BR")+" CCC";
            dot.appendChild(tip);
          });

          host.replaceChildren(svg);
          const legend=document.createElement("p");
          legend.style.cssText="font-size:12px;color:#aab4c2;margin-top:8px";
          legend.textContent="Azul: volume transferido · Verde/dourado: registros reais · Não representa preço";
          host.appendChild(legend);
        })
        .catch(() => {
          const host=panel.querySelector("#ccc-line-content");
          if (host) host.textContent="Gráfico indisponível.";
        });

      fetch("data/ccc-transfers.json?refresh=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error("Arquivo indisponível");
          return r.json();
        })
        .then(data => {
          const records = [...(data.transfers || [])]
            .sort((a,b) => Number(a.timestamp)-Number(b.timestamp));

          const txCounter = panel.querySelector("#ccc-transactions");
          if (txCounter) txCounter.textContent = records.length.toLocaleString("pt-BR") + " transferências consultadas";
          chart.replaceChildren();

          const heading = document.createElement("h3");
          heading.textContent = "Movimentações CCC · Etherscan V2";
          chart.appendChild(heading);

          if (!records.length) {
            chart.append("Nenhuma movimentação registrada.");
            return;
          }

          const max = Math.max(...records.map(x => Number(x.amount_ccc)));

          for (const tx of records) {
            const amount = Number(tx.amount_ccc);
            const date = new Date(Number(tx.timestamp)*1000)
              .toLocaleDateString("pt-BR");

            const label = document.createElement("p");
            label.style.cssText = "margin:12px 0 4px;font-size:13px";
            label.textContent = date+" · "+
              amount.toLocaleString("pt-BR")+" CCC";

            const track = document.createElement("div");
            track.style.cssText =
              "height:13px;background:#292929;border-radius:8px;overflow:hidden";

            const bar = document.createElement("div");
            bar.style.cssText =
              "height:100%;background:linear-gradient(90deg,#806020,#e6c57d);border-radius:8px";
            bar.style.width = (max ? amount/max*100 : 0)+"%";

            track.appendChild(bar);
            chart.append(label,track);
          }

          const note = document.createElement("p");
          note.style.cssText = "font-size:12px;color:#999;margin-top:18px";
          note.textContent =
            "Fonte: Etherscan V2 · Última atualização: " + (data.updated_at || "não informada") + " · Histórico armazenado localmente.";
          chart.appendChild(note);
        })
        .catch(() => {
          chart.textContent = "Histórico indisponível no momento.";
        });
    }

  }

  const previousLogos = detail.querySelector(".capital-trade-logos");
  if (previousLogos) previousLogos.remove();

  if (title === "CAPITAL TRADE") {
    const logos = document.createElement("div");
    logos.className = "capital-trade-logos";
    logos.style.cssText = "display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;margin:20px auto 28px";

    for (const [src, alt] of [
      ["assets/logo.png", "Carbon Credit Coins"],
      ["assets/capital-trade.png", "Capital Trade"]
    ]) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = alt;
      img.style.cssText = "width:140px;max-width:38vw;height:140px;object-fit:contain";
      logos.appendChild(img);
    }

    description.parentNode.insertBefore(logos, description);
  }

  menu.hidden = true;
  detail.hidden = false;
  window.scrollTo(0, 0);
}

sections.forEach(([title, text]) => {
  const button = document.createElement("button");
  button.type = "button";

  const span = document.createElement("span");
  span.textContent = title;

  if (title === "Ethereum" || title === "CAPITAL TRADE") {
    button.classList.add("eth-menu-button");
    span.textContent = "";
    span.className = "eth-chrome-wrap";

    const word = document.createElement("span");
    word.className = "eth-chrome-word";

    word.textContent = title;

    span.appendChild(word);
  }
  if (title === "Ethereum") button.classList.add("eth-menu-button");
  button.appendChild(span);

  button.addEventListener("click", () => {
    
    openDetail(title, text);
  });

  navigation.appendChild(button);
});

whitepaperButton.type = "button";
whitepaperButton.textContent = "WHITEPAPER 2026";
